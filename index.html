<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketViandes — maquette de l'application client</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bench:#E7EAEC; --bench-2:#DDE1E4; --panel:#FFFFFF; --ink:#15181B; --muted:#6B767D;
  --line:#DCE1E4; --line-soft:#EDF0F2;
  --accent:#A3122B; --accent-ink:#FFFFFF; --accent-soft:#FAEBEE;
  --cold:#1F6C8C; --cold-soft:#E8F2F6; --ok:#146B52; --ok-soft:#E7F3EF;
  --warn:#8A5B12; --warn-soft:#FBF1E0;
  --shadow:0 18px 50px rgba(20,30,38,.18); --radius:14px;
  --font-display:"Bricolage Grotesque",Georgia,serif;
  --font-ui:"Inter","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bench:#121618; --bench-2:#0D1113; --panel:#1A1F22; --ink:#E9EEF0; --muted:#98A5AC;
    --line:#2B3237; --line-soft:#232A2E; --accent:#D8425C; --accent-ink:#1A1F22; --accent-soft:#2A1B20;
    --cold:#6FB6D4; --cold-soft:#17272E; --ok:#5FC2A2; --ok-soft:#14261F; --warn:#D9A74E; --warn-soft:#272011;
    --shadow:0 18px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bench:#121618; --bench-2:#0D1113; --panel:#1A1F22; --ink:#E9EEF0; --muted:#98A5AC;
  --line:#2B3237; --line-soft:#232A2E; --accent:#D8425C; --accent-ink:#1A1F22; --accent-soft:#2A1B20;
  --cold:#6FB6D4; --cold-soft:#17272E; --ok:#5FC2A2; --ok-soft:#14261F; --warn:#D9A74E; --warn-soft:#272011;
  --shadow:0 18px 50px rgba(0,0,0,.5);
}
html[lang="ar"]{ --font-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --font-display:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bench);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.bench{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:100vh}
.rail{background:var(--bench-2);border-inline-end:1px solid var(--line);padding:26px 24px 40px;display:flex;flex-direction:column;gap:20px}
.brandmark{display:flex;align-items:baseline;gap:9px}
.brandmark b{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.brandmark span{font-size:12px;color:var(--muted)}
.rail h1{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.25;margin:0;letter-spacing:-.02em;max-width:26ch}
.rail p.lead{margin:0;color:var(--muted);font-size:13.5px;max-width:36ch}
.langpick{display:flex;gap:7px}
.langpick button{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:13px;color:var(--muted);background:var(--panel)}
.langpick button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:600}
.screens{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.screens button{text-align:start;padding:10px 13px;background:var(--panel);font-size:13.5px;display:flex;align-items:center;gap:10px;color:var(--muted)}
.screens button b{font-weight:500;color:var(--ink)}
.screens button i{font-style:normal;font-size:11px;width:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.screens button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.screens button[aria-current="true"] b,.screens button[aria-current="true"] i{color:var(--accent-ink)}
.note{border-inline-start:3px solid var(--accent);padding:2px 0;padding-inline-start:13px;font-size:13px;color:var(--muted)}
.note b{display:block;color:var(--ink);font-weight:600;margin-bottom:3px;font-size:13.5px}
.rail footer{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.6}
.themeToggle{align-self:flex-start;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted);background:var(--panel)}
.stage{display:grid;place-items:center;padding:40px 20px}

.phone{width:392px;height:830px;max-height:calc(100vh - 80px);background:var(--panel);border-radius:34px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.status{display:flex;justify-content:space-between;align-items:center;padding:11px 20px 5px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.view{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain}
.view::-webkit-scrollbar{width:0}
.pad{padding:0 18px 22px}

.appbar{display:flex;align-items:center;gap:12px;padding:6px 18px 12px}
.appbar h2{font-family:var(--font-display);font-weight:600;font-size:21px;margin:0;letter-spacing:-.02em}
html[lang="ar"] .appbar h2{font-size:19px;letter-spacing:0}
.back{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-size:15px;line-height:1;flex:0 0 auto}

.freshband{margin:0 18px 14px;padding:11px 13px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.freshband .l1{font-size:13.5px;font-weight:600;color:var(--accent)}
.freshband .l2{font-size:12px;color:var(--muted);margin-top:2px}

.rowcards{display:flex;gap:9px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.rowcards::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--muted);background:var(--panel);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

.searchbox{margin:0 18px 14px;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--panel)}
.searchbox input{border:0;background:none;font:inherit;font-size:14px;color:var(--ink);width:100%;outline:none}
.searchbox span{color:var(--muted);font-size:14px}

.item{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line-soft);width:100%;text-align:start}
.thumb{width:62px;height:62px;border-radius:11px;display:grid;place-items:center;font-size:27px;background:var(--line-soft)}
.item h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.3}
.item .meta{font-size:12px;color:var(--muted);margin-top:3px}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:5px;margin-inline-end:5px;font-weight:600}
.tag.cold{background:var(--cold-soft);color:var(--cold)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.low{background:var(--warn-soft);color:var(--warn)}
.tag.out{background:var(--line-soft);color:var(--muted)}
.tag.promo{background:var(--accent-soft);color:var(--accent)}
.price{text-align:end;font-variant-numeric:tabular-nums}
.price b{font-family:var(--font-display);font-weight:600;font-size:17px}
.price span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.item[disabled]{opacity:.45}

.hero{margin:0 18px 16px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.hero .top{padding:15px 16px 13px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .top h3{margin:0;font-size:15px;font-weight:600}
.hero .top p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.hero .amount{font-family:var(--font-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;direction:ltr}
.hero .bar{height:5px;background:var(--line-soft)}
.hero .bar i{display:block;height:100%;background:var(--accent)}
.hero .bot{padding:11px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line-soft)}

.sect{margin:20px 18px 9px;display:flex;justify-content:space-between;align-items:baseline}
.sect h3{font-family:var(--font-display);font-weight:600;font-size:16px;margin:0}
.sect a{font-size:12.5px;color:var(--accent);text-decoration:none}

.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 18px}
.quick{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:3px}
.quick b{font-size:13.5px;font-weight:600}
.quick span{font-size:11.5px;color:var(--muted)}

.photo{height:184px;border-radius:var(--radius);display:grid;place-items:center;font-size:62px;background:var(--line-soft);margin-bottom:15px;position:relative}
.photo small{position:absolute;bottom:9px;inset-inline-end:11px;font-size:10.5px;color:var(--muted);background:var(--panel);padding:2px 7px;border-radius:5px}
.ticket{border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;background:linear-gradient(180deg,var(--panel),var(--line-soft))}
.ticket .k{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1;direction:ltr}
.ticket .u{font-size:12.5px;color:var(--muted);margin-top:5px}
.ticket .r{text-align:end;font-size:12px;color:var(--muted);line-height:1.5}

.specs{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.specs div{display:flex;justify-content:space-between;gap:14px;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line-soft)}
.specs div:last-child{border-bottom:0}
.specs span{color:var(--muted)}
.specs b{font-weight:600;text-align:end}

.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.stepper button{width:44px;height:44px;font-size:19px;line-height:1;display:grid;place-items:center}
.stepper button:hover{background:var(--line-soft)}
.stepper .val{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;border-inline-start:1px solid var(--line);border-inline-end:1px solid var(--line);height:44px;display:grid;place-items:center}
.unitpick{display:flex;gap:7px;margin:11px 0 14px}
.unitpick button{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:12.5px;color:var(--muted)}
.unitpick button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}

textarea.note-in{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;font-size:13.5px;resize:none;background:var(--panel);color:var(--ink)}
textarea.note-in::placeholder{color:var(--muted)}

.callout{display:flex;gap:10px;border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.5;background:var(--warn-soft);color:var(--warn);margin:14px 0}
.callout b{display:block;margin-bottom:2px}

.cartline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.cartline h4{margin:0;font-size:14px;font-weight:600}
.cartline .q{font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.cartline .n{font-size:12px;color:var(--muted);margin-top:4px;font-style:italic}
.cartline .amt{text-align:end;font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px;white-space:nowrap}
.cartline .rm{display:block;margin-top:6px;font-size:12px;color:var(--muted);text-align:end;width:100%}

.totals{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.totals div{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;color:var(--muted);font-variant-numeric:tabular-nums}
.totals div.big{color:var(--ink);font-size:17px;font-weight:600;padding-top:9px}
.totals div.big b{font-family:var(--font-display)}

.slot{width:100%;text-align:start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.slot b{font-size:14px;font-weight:600;display:block}
.slot span{font-size:12.5px;color:var(--muted)}
.slot[disabled]{opacity:.42}

.timeline{position:relative;padding-inline-start:26px;margin:4px 0 8px}
.timeline::before{content:"";position:absolute;inset-inline-start:7px;top:8px;bottom:14px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 19px}
.tl::before{content:"";position:absolute;inset-inline-start:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--line)}
.tl.done::before{background:var(--ok);border-color:var(--ok)}
.tl.now::before{background:var(--accent);border-color:var(--accent)}
.tl b{font-size:14px;font-weight:600;display:block}
.tl span{font-size:12.5px;color:var(--muted)}
.tl.todo b{color:var(--muted);font-weight:500}

.ordercard{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;width:100%;text-align:start}
.ordercard .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ordercard .h b{font-size:14px;font-variant-numeric:tabular-nums;direction:ltr}
.ordercard .h span{font-size:12px;color:var(--muted)}
.ordercard .d{font-size:12.5px;color:var(--muted);margin-top:5px}
.ordercard .f{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.ordercard .f b{font-variant-numeric:tabular-nums;font-size:14.5px}
.mini{border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12.5px}

.btn{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px;font-size:15px;font-weight:600;text-align:center}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.bar-bottom{flex:0 0 auto;padding:12px 18px;border-top:1px solid var(--line-soft);background:var(--panel)}
.bar-bottom .sum{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:9px;font-variant-numeric:tabular-nums}
.bar-bottom .sum b{color:var(--ink);font-size:15px}

.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel);padding:7px 4px 13px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:5px 0;position:relative}
.tabs button em{font-style:normal;font-size:18px;line-height:1}
.tabs button[aria-current="true"]{color:var(--accent);font-weight:600}
.badge{position:absolute;top:0;inset-inline-end:22%;background:var(--accent);color:var(--accent-ink);font-size:9.5px;font-weight:700;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

.center{text-align:center;padding:34px 8px}
.center .mark{font-size:52px;line-height:1}
.center h3{font-family:var(--font-display);font-size:21px;font-weight:600;margin:14px 0 6px}
.center p{color:var(--muted);font-size:13.5px;margin:0 auto;max-width:32ch}
.empty{text-align:center;color:var(--muted);padding:46px 20px;font-size:13.5px}

.login{padding:54px 26px 26px;display:flex;flex-direction:column;height:100%}
.login .logo{font-family:var(--font-display);font-size:29px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
html[lang="ar"] .login .logo{letter-spacing:0}
.login .sub{color:var(--muted);font-size:13.5px;margin-top:8px;max-width:28ch}
.field{margin-top:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;font-size:14.5px;background:var(--panel);color:var(--ink)}
.login .spacer{flex:1}
.num{direction:ltr;unicode-bidi:embed;display:inline-block}

@media (max-width:900px){
  .bench{grid-template-columns:1fr}
  .rail{border-inline-end:0;border-bottom:1px solid var(--line)}
  .stage{padding:22px 12px 40px}
  .phone{width:100%;max-width:392px;height:760px}
}
</style>
</head>
<body>
<div class="bench">
  <aside class="rail">
    <div class="brandmark"><b>MarketViandes</b><span id="railTag"></span></div>
    <h1 id="railTitle"></h1>
    <p class="lead" id="railLead"></p>
    <div class="langpick">
      <button data-lang="fr" aria-pressed="true">Français</button>
      <button data-lang="ar" aria-pressed="false">العربية</button>
    </div>
    <div class="screens" id="screenList"></div>
    <div class="note" id="screenNote"></div>
    <button class="themeToggle" id="themeBtn"></button>
    <footer id="railFoot"></footer>
  </aside>
  <main class="stage">
    <div class="phone">
      <div class="status"><span class="num">08:42</span><span id="statusDate"></span></div>
      <div class="view" id="view"></div>
      <div id="bottom"></div>
    </div>
  </main>
</div>

    if(f==="promo" && !p.promo) return false;
    if(f==="volaille" && p.cat!=="volaille") return false;
    if(f==="rouge" && p.cat!=="rouge") return false;
    if(q && !(p.n.fr+" "+p.n.ar).toLowerCase().includes(q)) return false;
    return true;
  });
  const chips = [["all",t("fAll")],["volaille",t("fPoultry")],["rouge",t("fRed")],["frais",t("fFresh")],["congele",t("fFrozen")],["promo",t("fPromo")]];
  return `
  <div class="appbar"><h2>${t("catalog")}</h2></div>
  <div class="searchbox"><span>⌕</span><input id="q" placeholder="${t("searchPh")}" value="${S.search}"></div>
  <div class="rowcards" style="margin-bottom:6px">
    ${chips.map(([k,l])=>`<button class="chip" aria-pressed="${f===k}" data-filter="${k}">${l}</button>`).join("")}
  </div>
  <div class="pad">${list.length ? list.map(itemRow).join("") : `<div class="empty">${t("noResult")}</div>`}</div>`;
}

function viewProduct(){
  const p = PRODUCTS.find(x=>x.id===S.product);
  return `
  <div class="appbar"><button class="back" data-back="catalog">${LANG==="ar"?"→":"←"}</button><h2 style="font-size:17px">${pname(p)}</h2></div>
  <div class="pad">
    <div class="photo">${p.ic}<small>${t("photoNote")}</small></div>
    <div class="ticket">
      <div><div class="k">${fmt(p.p)}</div><div class="u">${t("priceDated")}</div></div>
      <div class="r">
        ${p.promo?`<span class="tag promo">${t("promoText")}</span><br>`:""}
        ${stockTag(p)}<br>${num(p.stock)} ${t("kgs")} ${t("remaining")}
      </div>
    </div>
    <div class="specs">
      <div><span>${t("soldAs")}</span><b>${t("soldKg")}</b></div>
      ${p.cal?`<div><span>${t("caliber")}</span><b>≈ ${num(kg(p.cal))} ${t("kgs")} ${t("perPiece")}</b></div>`:""}
      <div><span>${t("state")}</span><b>${p.state==="congelé"?t("fFrozen"):t("fFresh")}</b></div>
      ${p.dlc?`<div><span>${t("useBy")}</span><b>${num(p.dlc)}</b></div>`:""}
      <div><span>${t("origin")}</span><b>${p.org[LANG]}</b></div>
    </div>

    <div style="font-size:13px;color:var(--muted);margin-bottom:8px">${t("howMany")}</div>
    <div class="stepper">
      <button data-qty="-1">−</button>
      <div class="val">${num(qtyTxt(S.qty))} ${t("kgs")}</div>
      <button data-qty="1">+</button>
    </div>
    <div class="unitpick">
      ${QUICK_KG.map(v=>`<button aria-pressed="${S.qty===v}" data-setqty="${v}">${num(v)} ${t("kgs")}</button>`).join("")}
    </div>

    <div style="margin-top:4px">
      <textarea class="note-in" id="prep" rows="2" placeholder="${t("prepPh")}">${S.note}</textarea>
    </div>
    <div class="callout"><span>⚖</span><div><b>${t("estTitle")}</b>${t("estBody")}</div></div>
  </div>`;
}

function viewCart(){
  if(!S.cart.length){
    return `<div class="appbar"><h2>${t("cart")}</h2></div>
      <div class="empty">${t("cartEmpty")}<br><br><button class="mini" data-tab="catalog">${t("seeCatalog")}</button></div>`;
  }
  const total = cartTotal();
  return `
  <div class="appbar"><h2>${t("cart")}</h2></div>
  <div class="pad">
    ${S.cart.map((l,i)=>{
      const p = PRODUCTS.find(x=>x.id===l.id);
      return `<div class="cartline">
        <div>
          <h4>${pname(p)}</h4>
          <div class="q">${num(qtyTxt(l.qty))} ${t("kgs")} · ${num(fmt(p.p))} ${t("perKg")}</div>
          ${l.note?`<div class="n">« ${l.note} »</div>`:""}
        </div>
        <div>
          <div class="amt">${num(fmt(lineAmount(l)))}</div>
          <button class="rm" data-remove="${i}">${t("remove")}</button>
        </div>
      </div>`;
    }).join("")}
    <div class="totals">
      <div><span>${t("items")}</span><span>${num(S.cart.length)}</span></div>
      <div><span>${t("orderedWeightShort")}</span><span>${num(qtyTxt(cartWeight()))} ${t("kgs")}</span></div>
      <div class="big"><span>${t("estTotal")}</span><b>${num(fmt(total))} ${t("currency")}</b></div>
    </div>
    ${total<MIN_ORDER?`<div class="callout"><span>!</span><div><b>${t("minTitle")}</b>${t("minBody1")} ${fmt(MIN_ORDER)} ${t("currency")}. ${t("minBody2")} ${fmt(MIN_ORDER-total)} ${t("currency")}.</div></div>`:""}
    <div class="callout"><span>⚖</span><div><b>${t("realTitle")}</b>${t("realBody")}</div></div>
  </div>`;
}

function viewDelivery(){
  return `
  <div class="appbar"><button class="back" data-back="cart">${LANG==="ar"?"→":"←"}</button><h2>${t("delivery")}</h2></div>
  <div class="pad">
    <div class="specs" style="margin-bottom:17px">
      <div><span>${t("address")}</span><b>${t("addr")}</b></div>
      <div><span>${t("zone")}</span><b>${t("zoneVal")}</b></div>
      <div><span>${t("contact")}</span><b>${t("contactVal")}</b></div>
    </div>
    <div class="sect" style="margin:0 0 10px"><h3>${t("slots")}</h3></div>
    ${SLOTS.map((s,i)=>`
      <button class="slot" ${s.open?"":"disabled"} aria-pressed="${S.slot===s.id}" data-slot="${s.id}">
        <span><b>${t("slotDays")[i]}</b><span>${num(s.h)} · ${t("slotNotes")[i]}</span></span>
        <span style="font-size:19px">${S.slot===s.id?"●":"○"}</span>
      </button>`).join("")}
    <div class="callout" style="background:var(--line-soft);color:var(--muted)">
      <span>⏱</span><div><b>${t("cutoffTitle")}</b>${t("cutoffBody")}</div>
    </div>
  </div>`;
}

function viewConfirm(){
  const i = Math.max(0, SLOTS.findIndex(x=>x.id===S.slot));
  return `
  <div class="pad" style="padding-top:12px">
    <div class="center">
      <div class="mark">✓</div>
      <h3>${t("okTitle")}</h3>
      <p>${t("okBody")}</p>
    </div>
    <div class="specs">
      <div><span>${t("number")}</span><b>${num(S.ref)}</b></div>
      <div><span>${t("delivery")}</span><b>${t("slotDays")[i]}</b></div>
      <div><span>${t("slot")}</span><b>${num(SLOTS[i].h)}</b></div>
      <div><span>${t("orderedWeightShort")}</span><b>${num(qtyTxt(cartWeight()))} ${t("kgs")}</b></div>
      <div><span>${t("estTotal")}</span><b>${num(fmt(cartTotal()))} ${t("currency")}</b></div>
    </div>
    <div class="callout"><span>⚖</span><div><b>${t("nextTitle")}</b>${t("nextBody")}</div></div>
  </div>`;
}

function viewTrack(){
  const w = cartWeight() || 18;
  const est = cartTotal() || 1180;
  const wReal = w*1.028, real = est*1.028;
  return `
  <div class="appbar"><h2>${t("order")} ${num(S.ref)}</h2></div>
  <div class="pad">
    <div class="hero" style="margin:0 0 17px">
      <div class="top">
        <div><h3>${S.weighed?t("finalAmount"):t("estAmount")}</h3><p>${S.weighed?t("weighedAt"):t("willAdjust")}</p></div>
        <div class="amount">${fmt(S.weighed?real:est)}</div>
      </div>
      ${S.weighed
        ? `<div class="bot">${t("orderedWeight")} ${num(qtyTxt(w))} ${t("kgs")} → ${t("weighed")} ${num(kg(wReal))} ${t("kgs")} · ${t("gapLine")}</div>`
        : `<div class="bot">${t("deliveryPlanned")}</div>`}
    </div>
    <div class="timeline">
      <div class="tl done"><b>${t("tl1")}</b><span>${t("tl1s")}</span></div>
      <div class="tl done"><b>${t("tl2")}</b><span>${t("tl2s")}</span></div>
      <div class="tl ${S.weighed?"done":"now"}"><b>${t("tl3")}</b><span>${t("tl3s")}</span></div>
      <div class="tl ${S.weighed?"now":"todo"}"><b>${t("tl4")}</b><span>${S.weighed?t("tl4s"):t("tl4w")}</span></div>
      <div class="tl todo"><b>${t("tl5")}</b><span>${t("tl5s")}</span></div>
      <div class="tl todo"><b>${t("tl6")}</b><span>—</span></div>
    </div>
    ${S.weighed?`<div class="callout" style="background:var(--ok-soft);color:var(--ok)"><span>✓</span><div><b>${t("weighOkTitle")}</b>${t("weighOkBody")}</div></div>`:""}
    <button class="btn ghost" data-weigh="1">${S.weighed?t("unsimulate"):t("simulate")}</button>
    <div style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px">${t("demoBtn")}</div>
  </div>`;
}

function viewOrders(){
  return `
  <div class="appbar"><h2>${t("myOrders")}</h2></div>
  <div class="pad">
    <button class="ordercard" data-tab="track">
      <div class="h"><b>${S.ref}</b><span class="tag low">${t("inPrep")}</span></div>
      <div class="d">${t("deliveryPlanned")}</div>
      <div class="f"><span style="font-size:12.5px;color:var(--muted)">${t("estimated")}</span><b>${num(fmt(cartTotal()||1180))} ${t("currency")}</b></div>
    </button>
    ${PAST.map((o,i)=>`
      <div class="ordercard">
        <div class="h"><b>${o.ref}</b><span>${t("pastStatus")[i]}</span></div>
        <div class="d">${t("pastDates")[i]}<br>${t("pastLines")[i]}</div>
        <div class="f">
          <button class="mini" data-reorder="1">${t("reorder")}</button>
          <b>${num(fmt(o.real))} ${t("currency")}</b>
        </div>
      </div>`).join("")}
  </div>`;
}

function viewAccount(){
  return `
  <div class="appbar"><h2>${t("account")}</h2></div>
  <div class="pad">
    <div class="specs" style="margin-bottom:17px">
      <div><span>${t("customer")}</span><b>${t("client")}</b></div>
      <div><span>${t("ice")}</span><b>${num("002 415 887 000 061")}</b></div>
      <div><span>${t("zone")}</span><b>${t("zoneVal")}</b></div>
      <div><span>${t("terms")}</span><b>${t("terms30")}</b></div>
    </div>
    <div class="sect" style="margin:0 0 10px"><h3>${t("finance")}</h3></div>
    <div class="specs" style="margin-bottom:17px">
      <div><span>${t("outstanding")}</span><b>${num("14 280,00")} ${t("currency")}</b></div>
      <div><span>${t("limit")}</span><b>${num("25 000,00")} ${t("currency")}</b></div>
      <div><span>${t("overdue")}</span><b style="color:var(--accent)">${num("4 120,00")} ${t("currency")}</b></div>
    </div>
    <div class="sect" style="margin:0 0 10px"><h3>${t("invoices")}</h3></div>
    <div class="specs">
      ${INV.map((v,i)=>`<div><span>${t("invLines")[i]}</span><b>${num(fmt(v))}</b></div>`).join("")}
    </div>
    <button class="btn ghost" style="margin-top:17px" data-go="login">${t("logout")}</button>
  </div>`;
}

function bottomBar(){
  const tabs = [["home",t("tHome"),"⌂"],["catalog",t("tCatalog"),"☰"],["cart",t("tCart"),"▣"],["orders",t("tOrders"),"✓"],["account",t("tAccount"),"◉"]];
  const nav = `<div class="tabs">${tabs.map(([k,l,i])=>`
      <button data-tab="${k}" aria-current="${S.screen===k||(k==="orders"&&S.screen==="track")}">
        <em>${i}</em>${l}${k==="cart"&&S.cart.length?`<span class="badge">${S.cart.length}</span>`:""}
      </button>`).join("")}</div>`;

  if(S.screen==="login") return "";
  if(S.screen==="confirm"){
    return `<div class="bar-bottom">
      <button class="btn" data-tab="track">${t("followOrder")}</button>
      <button class="btn ghost" style="margin-top:9px" data-tab="home">${t("backHome")}</button>
    </div>`;
  }
  if(S.screen==="product"){
    const p = PRODUCTS.find(x=>x.id===S.product);
    return `<div class="bar-bottom">
      <div class="sum"><span>${t("estAmount")}</span><b>${num(fmt(S.qty*p.p))} ${t("currency")}</b></div>
      <button class="btn" data-add="1">${t("addToCart")}</button>
    </div>`+nav;
  }
  if(S.screen==="cart" && S.cart.length){
    const total = cartTotal();
    return `<div class="bar-bottom">
      <div class="sum"><span>${t("estTotal")}</span><b>${num(fmt(total))} ${t("currency")}</b></div>
      <button class="btn" ${total<MIN_ORDER?"disabled":""} data-tab="delivery">${t("chooseSlot")}</button>
    </div>`+nav;
  }
  if(S.screen==="delivery"){
    return `<div class="bar-bottom">
      <div class="sum"><span>${t("estTotal")}</span><b>${num(fmt(cartTotal()))} ${t("currency")}</b></div>
      <button class="btn" ${S.slot?"":"disabled"} data-validate="1">${t("validate")}</button>
    </div>`+nav;
  }
  return nav;
}

/* ===================== rendu ===================== */
function render(){
  const v = {login:viewLogin,home:viewHome,catalog:viewCatalog,product:viewProduct,cart:viewCart,
             delivery:viewDelivery,confirm:viewConfirm,track:viewTrack,orders:viewOrders,account:viewAccount}[S.screen];
  const view = document.getElementById("view");
  view.innerHTML = v();
  view.scrollTop = 0;
  document.getElementById("bottom").innerHTML = bottomBar();
  document.getElementById("statusDate").textContent = t("statusDate");
  renderRail();
}
function renderRail(){
  document.getElementById("railTag").textContent = t("railTag");
  document.getElementById("railTitle").textContent = t("railTitle");
  document.getElementById("railLead").textContent = t("railLead");
  document.getElementById("railFoot").innerHTML = t("railFoot");
  document.getElementById("themeBtn").textContent = t("theme");
  document.getElementById("screenList").innerHTML = t("screens").map(([k,l],i)=>`
    <button data-screen="${k}" aria-current="${S.screen===k}"><i>${String(i+1).padStart(2,"0")}</i><b>${l}</b></button>`).join("");
  const cur = t("screens").find(s=>s[0]===S.screen);
  document.getElementById("screenNote").innerHTML = cur?`<b>${cur[1]}</b>${cur[2]}`:"";
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===LANG));
}
function goScreen(k){ if(k==="product"&&!S.product) k="catalog"; S.screen=k; render(); }
function openProduct(id){ S.product=id; S.qty=5; S.note=""; goScreen("product"); }
const NOTE_CUT = () => LANG==="ar" ? "مقطّع 8" : "découpé en 8";
function reorder(){
  S.cart=[{id:1,qty:9,note:NOTE_CUT()},{id:6,qty:8,note:""},{id:10,qty:4,note:""}];
  goScreen("cart");
}

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-lang],[data-screen],[data-tab],[data-go],[data-product],[data-filter],[data-qty],[data-setqty],[data-add],[data-remove],[data-slot],[data-validate],[data-back],[data-weigh],[data-reorder]");
  if(!el) return;
  e.preventDefault();
  const d = el.dataset;

  if(d.lang){
    LANG = d.lang;
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG==="ar" ? "rtl" : "ltr";
    S.cart = S.cart.map(l=>({...l, note:l.note?NOTE_CUT():""}));
    return render();
  }
  if(d.screen){
    const k = d.screen;
    if(k==="product" && !S.product){ S.product=1; S.qty=9; }
    if((k==="cart"||k==="delivery"||k==="confirm"||k==="track") && !S.cart.length) reorder();
    if(k==="confirm" && !S.slot) S.slot="a";
    return goScreen(k);
  }
  if(d.tab) return goScreen(d.tab);
  if(d.go) return goScreen(d.go);
  if(d.back) return goScreen(d.back);
  if(d.product) return openProduct(+d.product);
  if(d.reorder) return reorder();
  if(d.filter){ S.filter=d.filter; return render(); }
  if(d.qty){ S.note=document.getElementById("prep")?.value||S.note; S.qty=Math.max(0.5, Math.round((S.qty+(+d.qty))*2)/2); return render(); }
  if(d.setqty){ S.note=document.getElementById("prep")?.value||S.note; S.qty=+d.setqty; return render(); }
  if(d.add){ S.note=document.getElementById("prep")?.value||""; S.cart.push({id:S.product,qty:S.qty,note:S.note}); return goScreen("cart"); }
  if(d.remove){ S.cart.splice(+d.remove,1); return render(); }
  if(d.slot){ S.slot=d.slot; return render(); }
  if(d.validate){ S.weighed=false; return goScreen("confirm"); }
  if(d.weigh){ S.weighed=!S.weighed; return render(); }
});

document.addEventListener("input", e=>{
  if(e.target.id==="q"){
    S.search = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const n = document.getElementById("q");
    if(n){ n.focus(); n.setSelectionRange(pos,pos); }
  }
});

document.getElementById("themeBtn").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark?"light":"dark");
});

render();
</script>
</body>
</html>
